<div class="container my-5">
  <h2 class="section-title">Shopping Cart</h2>

  <div class="row" *ngIf="cartItems.length > 0">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <table class="table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of cartItems">
                <td>
                  <div class="d-flex align-items-center">
                    <img [src]="item.image || 'https://via.placeholder.com/80x80'" class="me-3" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;" [alt]="item.name">
                    <div>
                      <strong>{{ item.name }}</strong>
                    </div>
                  </div>
                </td>
                <td>₹{{ item.price }}</td>
                <td>
                  <div class="btn-group">
                    <button class="btn btn-sm btn-outline-secondary" (click)="updateQuantity(item.foodId, item.quantity - 1)">-</button>
                    <span class="btn btn-sm btn-outline-secondary">{{ item.quantity }}</span>
                    <button class="btn btn-sm btn-outline-secondary" (click)="updateQuantity(item.foodId, item.quantity + 1)">+</button>
                  </div>
                </td>
                <td>₹{{ item.price * item.quantity }}</td>
                <td>
                  <button class="btn btn-sm btn-danger" (click)="removeItem(item.foodId)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Order Summary</h5>
          <hr>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal:</span>
            <span>₹{{ totalPrice }}</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>Delivery:</span>
            <span>Free</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <strong>Total:</strong>
            <strong class="text-primary">₹{{ totalPrice }}</strong>
          </div>

          <div class="mb-3">
            <label class="form-label">Delivery Address *</label>
            <textarea class="form-control" [(ngModel)]="deliveryAddress" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" [(ngModel)]="phone" required>
          </div>

          <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

          <button class="btn btn-primary w-100 btn-lg" (click)="placeOrder()" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            Place Order
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="cartItems.length === 0">
    <i class="bi bi-cart-x"></i>
    <h4>Your cart is empty</h4>
    <p>Start adding items to your cart</p>
    <button class="btn btn-primary" routerLink="/foods">Browse Foods</button>
  </div>
</div>
