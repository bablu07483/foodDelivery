<div class="container my-5 position-relative">
  <h2 class="text-center mb-4 fw-bold">Marketplace: Rajahmundry</h2>

  <div class="card p-3 mb-4 shadow-sm border-0 bg-light rounded-4">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Search Dishes</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control border-start-0" [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="Search..." />
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Category</label>
        <select class="form-select" [(ngModel)]="selectedCategory" (change)="onCategoryChange()">
          <option value="">All Categories</option>
          <option value="veg">Vegetarian</option>
          <option value="non-veg">Non-Vegetarian</option>
          <option value="beverages">Beverages</option>
          <option value="snacks & starters">Snacks & Starters</option>
          <option value="desserts">Desserts</option>
          <option value="breakfast">Breakfast</option>
          <option value="fastfood">Fast Food</option>
          <option value="south-indian">South Indian</option>
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Select Restaurant</label>
        <select class="form-select" [(ngModel)]="selectedRestaurantId" (change)="onRestaurantChange()">
          <option value="">1. All Restaurants</option>
          <option value="nearby">2. 📍 Nearby Restaurants</option>
          <option disabled>────── 3. Specific Restaurants ──────</option>
          <option *ngFor="let r of restaurants" [value]="r._id">{{ r.name }}</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="!loading && selectedRestaurantId === '' && foods.length > 0">
    <div class="col-md-4 mb-4" *ngFor="let food of foods">
      <ng-container *ngTemplateOutlet="foodCardTemplate; context: { $implicit: food }"></ng-container>
    </div>
  </div>

  <div *ngIf="!loading && selectedRestaurantId !== '' && groupedFoods.length > 0">
    <div *ngFor="let group of groupedFoods" class="mb-5">
      <div class="d-flex align-items-center mb-3 p-3 bg-white rounded-4 shadow-sm border-start border-primary border-5">
        <img [src]="group.details.image || 'assets/default-restaurant.jpg'" class="rounded-circle me-3" width="55" height="55" style="object-fit: cover;">
        <div>
          <h4 class="fw-bold mb-0">{{ group.details.name }}</h4>
          <span class="badge bg-light text-dark border">{{ group.details.cuisine }}</span>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let food of group.items">
          <ng-container *ngTemplateOutlet="foodCardTemplate; context: { $implicit: food }"></ng-container>
        </div>
      </div>
    </div>
  </div>

  <ng-template #foodCardTemplate let-food>
    <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
      <img [src]="food.image || 'assets/default-food.jpg'" class="card-img-top" style="height: 200px; object-fit: cover;">
      <div class="card-body d-flex flex-column">
        <h5 class="fw-bold mb-1">{{ food.name }}</h5>
        <p class="text-muted small flex-grow-1">{{ food.description }}</p>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <span class="h5 text-primary fw-bold mb-0">₹{{ food.price }}</span>
          <button class="btn btn-success rounded-pill px-4 d-flex align-items-center" (click)="addToCart(food)">
            <i class="bi bi-bag-plus me-2"></i> Add
          </button>
        </div>
      </div>
    </div>
  </ng-template>

  <div class="overlay-backdrop" *ngIf="selectedFood">
    <div class="selection-card p-4 shadow-lg rounded-4 bg-white">
      <h4 class="fw-bold mb-3 border-bottom pb-2">Customize Quantity</h4>
      <div class="d-flex align-items-center mb-4 p-2 bg-light rounded-3">
        <img [src]="selectedFood.image" class="rounded-2" width="70" height="70" style="object-fit: cover;">
        <div class="ms-3">
          <h6 class="mb-0 fw-bold">{{selectedFood.name}}</h6>
          <small class="text-muted">{{selectedFood.restaurant?.name}}</small>
        </div>
      </div>
      
      <div class="mb-4">
        <label class="form-label small fw-bold">Select Quantity</label>
        <div class="input-group mx-auto" style="max-width: 160px;">
          <button class="btn btn-outline-dark" (click)="quantity = quantity > 1 ? quantity - 1 : 1">-</button>
          <input type="text" class="form-control text-center bg-white fw-bold" [value]="quantity" readonly>
          <button class="btn btn-outline-dark" (click)="quantity = quantity + 1">+</button>
        </div>
      </div>

      <div class="row g-2">
        <div class="col-6"><button class="btn btn-secondary w-100 rounded-pill" (click)="selectedFood = null">Cancel</button></div>
        <div class="col-6">
          <button class="btn btn-success w-100 rounded-pill fw-bold" (click)="confirmOrder()">
            <i class="bi bi-bag-check me-1"></i> Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center my-5" *ngIf="!loading && foods.length === 0">
    <i class="bi bi-emoji-frown display-1 text-muted"></i>
    <h4 class="mt-3">No foods found matching this selection</h4>
    <button class="btn btn-primary mt-2" (click)="clearDietFilter()">Return to All Foods</button>
  </div>
</div>
