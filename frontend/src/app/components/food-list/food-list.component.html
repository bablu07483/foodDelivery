<div class="container my-5">

  <!-- Page Title -->
  <h2 class="section-title text-center mb-4">Food Menu</h2>

  <!-- Filters Section -->
  <div class="filter-section card p-3 mb-4 shadow-sm">
    <div class="row">

      <!-- Search -->
      <div class="col-md-4 mb-3">
        <label class="form-label">Search</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="searchTerm"
          (input)="onSearch()"
          placeholder="Search foods..."
        />
      </div>

      <!-- Category -->
      <div class="col-md-4 mb-3">
        <label class="form-label">Category</label>
        <select
          class="form-select"
          [(ngModel)]="selectedCategory"
          (change)="onCategoryChange()"
        >
          <option value="">All Categories</option>
          <option value="veg">Vegetarian</option>
          <option value="non-veg">Non-Vegetarian</option>
        </select>
      </div>

      <!-- Restaurant -->
      <div class="col-md-4 mb-3">
        <label class="form-label">Restaurant</label>
        <select
          class="form-select"
          [(ngModel)]="selectedRestaurant"
          (change)="onRestaurantChange()"
        >
          <option value="">All Restaurants</option>
          <option *ngFor="let restaurant of restaurants" [value]="restaurant.name">
            {{ restaurant.name }}
          </option>
        </select>
      </div>

    </div>
  </div>

  <!-- Food Cards -->
  <div class="row" *ngIf="!loading && filteredFoods.length > 0">
    <div class="col-md-4 mb-4" *ngFor="let food of filteredFoods">
    <div class="card h-100 shadow-sm">

        <img
          [src]="food.image || 'https://via.placeholder.com/300x200'"
          class="card-img-top"
          [alt]="food.name"
        />

        <div class="card-body d-flex flex-column">
          <h5 class="card-title d-flex justify-content-between align-items-center">
            {{ food.name }}
            <span
              class="badge"
              [ngClass]="food.category === 'veg' ? 'bg-success' : 'bg-danger'"
            >
              {{ food.category === 'veg' ? 'Veg' : 'Non-Veg' }}
            </span>
          </h5>

          <p class="card-text text-muted">
            {{ food.description || 'Delicious food item' }}
          </p>

          <p class="text-secondary small mb-1">
            {{ food.restaurant?.name || 'Popular Restaurant' }}
          </p>

          <p class="h5 text-primary mb-3">₹{{ food.price }}</p>

          <div class="mt-auto d-flex gap-2">
            <button
              class="btn btn-outline-primary w-50"
              (click)="viewDetails(food._id)"
            >
              View
            </button>

            <button
              class="btn btn-success w-50"
              (click)="addToCart(food)"
            >
              Add
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div class="text-center my-5" *ngIf="loading">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">Loading foods...</p>
  </div>

  <!-- Empty State -->
  <div class="text-center my-5" *ngIf="!loading && foods.length === 0">
    <i class="bi bi-inbox fs-1 text-muted"></i>
    <h4 class="mt-3">No foods found</h4>
    <p class="text-muted">Try adjusting your filters</p>
  </div>

</div>
