<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        
        <div class="bg-primary p-5 text-center text-white">
          <div class="position-relative d-inline-block">
            <img [src]="user?.profilePic || 'assets/default-avatar.png'" 
                 class="rounded-circle border border-4 border-white shadow" 
                 style="width: 120px; height: 120px; object-fit: cover;">
            
            <button class="btn btn-light btn-sm rounded-circle position-absolute bottom-0 end-0 shadow-sm" (click)="triggerFileInputClick()">
              <i class="bi bi-camera-fill"></i>
            </button>
            
            <input type="file" id="profilePicInput" style="display: none" (change)="onFileSelected($event)" accept="image/*">
          </div>
          
          <h3 class="mt-3 fw-bold mb-0">{{ user?.name || 'User' }}</h3>
          <p class="opacity-75 small">{{ user?.email || '' }}</p>
        </div>

        <div class="card-body p-4">
          <div class="list-group list-group-flush">
            
            <div class="list-group-item border-0 px-0 py-3 d-flex align-items-center">
              <i class="bi bi-telephone text-primary fs-4 me-3"></i>
              <div>
                <p class="mb-0 extra-small text-muted text-uppercase fw-bold">Phone Number</p>
                <p class="mb-0 fw-medium">{{ user?.phone || 'Not provided' }}</p>
              </div>
            </div>

            <div class="list-group-item border-0 px-0 py-3 d-flex align-items-center">
              <i class="bi bi-geo-alt text-danger fs-4 me-3"></i>
              <div>
                <p class="mb-0 extra-small text-muted text-uppercase fw-bold">Saved Address</p>
                <p class="mb-0 fw-medium">{{ user?.address || 'No address saved' }}</p>
              </div>
            </div>

            <div class="list-group-item border-0 px-0 py-3 d-flex align-items-center" routerLink="/orders">
              <i class="bi bi-bag-check text-success fs-4 me-3"></i>
              <div class="flex-grow-1">
                <p class="mb-0 fw-bold">My Orders</p>
                <p class="mb-0 extra-small text-muted">View your order history</p>
              </div>
              <i class="bi bi-chevron-right text-muted"></i>
            </div>
          </div>

          <button class="btn btn-outline-danger w-100 rounded-pill mt-4 fw-bold py-2" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> Log Out
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
